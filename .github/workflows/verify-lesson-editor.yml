name: Validate lesson editor JavaScript
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone scripts
        run: |
          node --check assets/fx-editor-all.js
          node --check assets/fx-course-existing-editor.js
          node --check assets/formula-x-lesson-page.js
          node --check assets/formula-x-lesson-teacher.js
          node --check assets/fx-lesson-studio-renderer.js
          node --check assets/fx-lesson-studio.js
          node tests/lesson-studio.cjs
          node tests/stable-lessons.cjs
          node tests/lesson-editor.cjs
          python tests/release-source.py
          node --check assets/fx-curated-literature-2027.js
          node --check assets/fx-curated-importer.js
          node tests/curated-lessons.cjs
      - name: Check edited inline HTML scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          paths=['lectii/romana/ion.html','lectii/romana/baltagul.html','lectii/matematica/progresii.html','assets/lectii/matematica/progresii.html']
          for path in paths:
              text=Path(path).read_text(encoding='utf-8')
              chunks=re.findall(r'<script\b[^>]*>(.*?)</script>',text,flags=re.I|re.S)
              for i,chunk in enumerate(chunks):
                  if not chunk.strip(): continue
                  with tempfile.NamedTemporaryFile(suffix='.js') as f:
                      f.write(chunk.encode('utf-8')); f.flush()
                      subprocess.run(['node','--check',f.name],check=True)
              print('OK',path)
          PY


  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: formula_x_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: formula_x_test
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable database contract
        run: psql -v ON_ERROR_STOP=1 -f tests/fixtures/stable-lessons-schema.sql
      - name: Install and rerun the universal migration
        run: |
          psql -v ON_ERROR_STOP=1 -f SUPABASE-UNIVERSAL-LECTII-2026.sql
          psql -v ON_ERROR_STOP=1 -f SUPABASE-UNIVERSAL-LECTII-2026.sql
      - name: Verify authorization and transactional persistence
        run: psql -v ON_ERROR_STOP=1 -f tests/stable-lessons.sql
