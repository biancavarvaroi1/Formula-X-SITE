# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate BAC 2027 lyrical lessons and professor navigation
        run: node tests/curated-lessons.cjs
      - name: Check public Harap-Alb illustrations
        run: node tests/public-harap-images.cjs
      - name: Check quiz progress across background events
        run: node tests/quiz-continuity.cjs
      # Static data only: no release script is executed and repository contents remain read-only.
      - name: Prepare verified Formula X lesson files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          url='https://formula-x-acces-cursuri.heartymink128.chatgpt.site/releases/Formula-X-integration-ccbaacba2caf.zip'
          data=subprocess.run(['curl','--fail','--location','--silent','--show-error','--max-time','120',url],check=True,capture_output=True).stdout
          assert len(data)<=10*1024*1024,'Release exceeds size limit'
          import importlib.util
          spec=importlib.util.spec_from_file_location('release','scripts/prepare-lesson-release.py')
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          helper.install(data,Path.cwd())
          PY
      - name: Install the current teacher editor on every lesson page
        run: python scripts/install-lesson-editor.py
      - name: Verify Ultima noapte uses its private lesson page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('cursuri/app.js').read_text(encoding='utf-8')
          assert 'FX.lessonUrl' in code or 'FX.catalogMarkup' in code, 'Shared lesson routing is missing'
          page=Path('lectii/romana/ultima-noapte.html').read_text(encoding='utf-8')
          assert "fx_open_lesson" in page and "formula-x-ultima-noapte-v1" in page, 'Protected lesson page is missing'
          print('Ultima noapte: private route and page verified.')
          PY
      - name: Check teacher editor visibility and deployed lesson integration
        run: |
          node tests/curated-lessons.cjs
          node tests/stable-lessons.cjs
          python tests/release-source.py
          node tests/lesson-editor.cjs
          python tests/lesson-editor-deploy.py
      - name: Add BAC 2027 shortcut to homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('index.html')
          html=page.read_text(encoding='utf-8')
          script='<script defer src="/assets/bac2027-link.js"></script>'
          if script not in html:
              if '</body>' not in html: raise RuntimeError('Homepage is missing body end tag')
              html=html.replace('</body>',script+'</body>',1)
              page.write_text(html,encoding='utf-8')
          print('Installed BAC 2027 shortcut; legacy archive preserved')
          PY
      - name: Install supplied BAC 2027 PDFs and verify every link
        run: python scripts/install-supplied-bac2027.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

