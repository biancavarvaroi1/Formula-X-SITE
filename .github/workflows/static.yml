# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate BAC 2027 lyrical lessons and professor navigation
        run: node tests/curated-lessons.cjs
      - name: Check public Harap-Alb illustrations
        run: node tests/public-harap-images.cjs
      - name: Check quiz progress across background events
        run: node tests/quiz-continuity.cjs
      # Static data only: no release script is executed and repository contents remain read-only.
      - name: Prepare verified Formula X lesson files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, zipfile, hashlib, io
          url='https://formula-x-acces-cursuri.heartymink128.chatgpt.site/releases/Formula-X-integration-ccbaacba2caf.zip'
          expected='ccbaacba2caf347d0ee3502e181f4642d5f6f8355bda2a87e3cc64f28dd34c50'
          data=subprocess.run(['curl','--fail','--location','--silent','--show-error','--max-time','120',url],check=True,capture_output=True).stdout
          assert len(data)<=10*1024*1024,'Release exceeds size limit'
          assert hashlib.sha256(data).hexdigest()==expected,'Release checksum mismatch'
          allowed={
              'index.html','profesori/index.html','assets/formula-x-portal.js',
              'assets/formula-x-lessons.css','assets/formula-x-lessons-core.js',
              'assets/formula-x-lesson-page.js','assets/formula-x-lesson-teacher.js',
              'lectii/romana/index.html','lectii/romana/harap-alb.html','lectii/romana/moara-cu-noroc.html',
              'cursuri/index.html','cursuri/app.js','cursuri/style.css','cursuri/lectie.html','cursuri/INTEGRARE-V48.md',
              'supabase/migrations/20261013_lessons_access.sql','docs/lectii-romana.md',
              'tests/lessons-access.cjs','tests/fixtures/v48-schema.sql',
              'assets/lessons/harap-alb.ab961091e73c78026604f1fe2c1667ec48e3b3ce548ac7a4db548719d96ef637.fxb',
              'assets/lessons/harap-alb/coperta.webp',
              'assets/lessons/moara-cu-noroc.1631e6d6b1db2d22f9a4fdcd29193a52d1fcc7e820fae8d3d387e38f74748f91.fxb',
              'assets/lessons/moara-cu-noroc/coperta.webp',
          }
          overrides={name:Path(name).read_bytes() for name in ['assets/formula-x-lessons-core.js','assets/formula-x-lesson-page.js','assets/formula-x-lesson-teacher.js','cursuri/app.js']}
          with zipfile.ZipFile(io.BytesIO(data)) as release:
              assert set(release.namelist())==allowed,'Unexpected release files'
              assert len(release.namelist())==len(allowed),'Duplicate release files'
              release.extractall('.')
          for name,contents in overrides.items():
              Path(name).write_bytes(contents)
          lesson_script='formula-x-lesson-page.'+hashlib.sha256(overrides['assets/formula-x-lesson-page.js']).hexdigest()[:16]+'.js'
          Path('assets',lesson_script).write_bytes(overrides['assets/formula-x-lesson-page.js'])
          for name in ['lectii/romana/harap-alb.html','lectii/romana/moara-cu-noroc.html','cursuri/lectie.html','profesori/index.html']:
              page=Path(name)
              page.write_text(page.read_text().replace('formula-x-lesson-page.js?v=20261014',lesson_script).replace('formula-x-lesson-teacher.js?v=20261014','formula-x-lesson-teacher.js?v=20261014-1539'))
          print('Prepared verified lesson files; kept the version-controlled homepage and BAC 2027 catalog.')
          PY
      - name: Install the current teacher editor on every lesson page
        run: python scripts/install-lesson-editor.py
      - name: Verify Ultima noapte uses its private lesson page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('cursuri/app.js').read_text(encoding='utf-8')
          assert "l.slug==='ultima-noapte'" in code, 'Dedicated Ultima noapte route is missing'
          page=Path('lectii/romana/ultima-noapte.html').read_text(encoding='utf-8')
          assert "fx_open_lesson" in page and "formula-x-ultima-noapte-v1" in page, 'Protected lesson page is missing'
          print('Ultima noapte: private route and page verified.')
          PY
      - name: Check teacher editor visibility and deployed lesson integration
        run: |
          node tests/lesson-editor.cjs
          python tests/lesson-editor-deploy.py
      - name: Add BAC 2027 shortcut to homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('index.html')
          html=page.read_text(encoding='utf-8')
          script='<script defer src="/assets/bac2027-link.js"></script>'
          if script not in html:
              if '</body>' not in html: raise RuntimeError('Homepage is missing body end tag')
              html=html.replace('</body>',script+'</body>',1)
              page.write_text(html,encoding='utf-8')
          print('Installed BAC 2027 shortcut; legacy archive preserved')
          PY
      - name: Install supplied BAC 2027 PDFs and verify every link
        run: python scripts/install-supplied-bac2027.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
