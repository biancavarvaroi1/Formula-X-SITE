# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Static data only: no release script is executed and repository contents remain read-only.
      - name: Prepare verified Formula X lesson files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, zipfile, hashlib, io
          url='https://formula-x-acces-cursuri.heartymink128.chatgpt.site/releases/Formula-X-integration-ccbaacba2caf.zip'
          expected='ccbaacba2caf347d0ee3502e181f4642d5f6f8355bda2a87e3cc64f28dd34c50'
          data=subprocess.run(['curl','--fail','--location','--silent','--show-error','--max-time','120',url],check=True,capture_output=True).stdout
          assert len(data)<=10*1024*1024,'Release exceeds size limit'
          assert hashlib.sha256(data).hexdigest()==expected,'Release checksum mismatch'
          allowed={
              'index.html','profesori/index.html','assets/formula-x-portal.js',
              'assets/formula-x-lessons.css','assets/formula-x-lessons-core.js',
              'assets/formula-x-lesson-page.js','assets/formula-x-lesson-teacher.js',
              'lectii/romana/index.html','lectii/romana/harap-alb.html','lectii/romana/moara-cu-noroc.html',
              'cursuri/index.html','cursuri/app.js','cursuri/style.css','cursuri/lectie.html','cursuri/INTEGRARE-V48.md',
              'supabase/migrations/20261013_lessons_access.sql','docs/lectii-romana.md',
              'tests/lessons-access.cjs','tests/fixtures/v48-schema.sql',
              'assets/lessons/harap-alb.ab961091e73c78026604f1fe2c1667ec48e3b3ce548ac7a4db548719d96ef637.fxb',
              'assets/lessons/harap-alb/coperta.webp',
              'assets/lessons/moara-cu-noroc.1631e6d6b1db2d22f9a4fdcd29193a52d1fcc7e820fae8d3d387e38f74748f91.fxb',
              'assets/lessons/moara-cu-noroc/coperta.webp',
          }
          overrides={name:Path(name).read_bytes() for name in ['assets/formula-x-lesson-page.js','assets/formula-x-lesson-teacher.js']}
          with zipfile.ZipFile(io.BytesIO(data)) as release:
              assert set(release.namelist())==allowed,'Unexpected release files'
              assert len(release.namelist())==len(allowed),'Duplicate release files'
              release.extractall('.')
          for name,contents in overrides.items():
              Path(name).write_bytes(contents)
          for name in ['lectii/romana/harap-alb.html','lectii/romana/moara-cu-noroc.html','cursuri/lectie.html','profesori/index.html']:
              page=Path(name)
              page.write_text(page.read_text().replace('formula-x-lesson-page.js?v=20261014','formula-x-lesson-page.js?v=20261014-1539').replace('formula-x-lesson-teacher.js?v=20261014','formula-x-lesson-teacher.js?v=20261014-1539'))
          print('Prepared 23 verified static website files and repository lesson UI updates.')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

