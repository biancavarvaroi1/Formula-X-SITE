<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="same-origin">
  <title>Portal Mentori | Formula X</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--primary:#7a3045;--soft:#d98fa3;--bg:#fff7f9;--card:#fff;--text:#2e2226;--muted:#786b70;--border:#eadde1;--ok:#19763b;--warn:#a9690b;--bad:#ae3030;--shadow:0 14px 40px rgba(71,37,49,.10)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg),#fff)} button,input,select{font:inherit}.hidden{display:none!important}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);padding:38px;background:#fff;border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow)}
    .xlogo{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border-radius:19px;background:linear-gradient(135deg,#c8941b,#f0cd66);color:#fff;font-weight:950;font-size:31px;box-shadow:0 8px 25px rgba(200,148,27,.25)}
    h1,h2,p{margin-top:0}.login-card h1{text-align:center;margin-bottom:7px}.sub{text-align:center;color:var(--muted);line-height:1.5;margin-bottom:28px}.field{margin-bottom:16px}.field label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px 15px;border:1px solid var(--border);border-radius:12px;outline:none}.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}
    .primary{border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:850;padding:14px 18px;cursor:pointer}.login-card .primary{width:100%}.primary:disabled{opacity:.6;cursor:wait}.msg{min-height:21px;margin-top:14px;text-align:center;font-size:13px;font-weight:700;color:var(--bad)}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.topbar-in{max-width:1380px;margin:auto;padding:14px 26px;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:11px}.brand-x{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#c8941b,#f0cd66);color:#fff;font-weight:950;font-size:22px}.brand strong{display:block}.brand small{color:var(--muted)}
    .ghost{border:1px solid var(--border);border-radius:10px;background:#fff;padding:9px 13px;font-weight:750;cursor:pointer}.main{max-width:1380px;margin:auto;padding:30px 26px 60px}.hero{padding:28px;border-radius:24px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--soft));box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.hero h1{margin-bottom:7px}.hero p{margin-bottom:0;opacity:.92}.pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:9px 14px;border-radius:999px;font-weight:850;white-space:nowrap}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0}.stat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 6px 22px rgba(0,0,0,.035)}.stat small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:850;letter-spacing:.5px}.stat b{display:block;font-size:32px;margin-top:5px}.s-new b{color:var(--warn)}.s-active b{color:var(--ok)}.s-inactive b{color:var(--bad)}
    .panel{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.04)}.panel-head{padding:20px;border-bottom:1px solid var(--border)}.panel-head h2{margin-bottom:14px;font-size:20px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 180px 190px auto;gap:10px}.toolbar input,.toolbar select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;outline:none}.admin-field{display:none}body.admin .admin-field{display:block}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th{text-align:left;padding:12px 15px;background:#faf8f9;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.55px}td{padding:15px;border-top:1px solid #f1eaed;font-size:14px;vertical-align:middle}tbody tr:hover{background:#fffafb}.name{font-weight:850}.email{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:850}.b-nou{background:#fff1d6;color:#88560c}.b-activ{background:#def4e5;color:#17682f}.b-inactiv{background:#fbe1e1;color:#932b2b}.status-select{padding:8px;border:1px solid var(--border);border-radius:9px;background:#fff}.center{padding:50px 22px;text-align:center;color:var(--muted)}
    @media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.hero{flex-direction:column}}@media(max-width:560px){.main{padding:20px 13px 45px}.topbar-in{padding:11px 13px}.brand small{display:none}.toolbar{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:15px}.stat b{font-size:27px}.hero{padding:21px}}
  </style>
</head>
<body>
<section id="login" class="login-wrap">
  <div class="login-card">
    <div class="xlogo">X</div><h1>Portal Mentori</h1><p class="sub">Spațiu privat Formula X. Accesul este disponibil numai mentorilor și administratorilor autorizați.</p>
    <form id="loginForm">
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label>Parolă</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button id="loginBtn" class="primary" type="submit">Intră în cont</button><div id="loginMsg" class="msg"></div>
    </form>
  </div>
</section>
<section id="app" class="hidden">
  <header class="topbar"><div class="topbar-in"><div class="brand"><div class="brand-x">X</div><div><strong>Formula X</strong><small>Portal privat pentru mentori</small></div></div><button id="logoutBtn" class="ghost">Deconectare</button></div></header>
  <main class="main">
    <section class="hero"><div><h1 id="hello">Bună!</h1><p id="heroText">Se încarcă datele...</p></div><div id="subjectPill" class="pill">Formula X</div></section>
    <section class="stats"><div class="stat"><small>Total elevi</small><b id="cTotal">0</b></div><div class="stat s-new"><small>Noi</small><b id="cNew">0</b></div><div class="stat s-active"><small>Activi</small><b id="cActive">0</b></div><div class="stat s-inactive"><small>Inactivi</small><b id="cInactive">0</b></div></section>
    <section class="panel"><div class="panel-head"><h2>Elevi înscriși</h2><div class="toolbar"><input id="search" type="search" placeholder="Caută nume, email sau telefon..."><select id="status"><option value="">Toate statusurile</option><option value="nou">Noi</option><option value="activ">Activi</option><option value="inactiv">Inactivi</option></select><select id="subject" class="admin-field"><option value="">Toate materiile</option><option value="romana">Română</option><option value="matematica">Matematică</option><option value="biologie">Biologie</option><option value="chimie">Chimie</option><option value="fizica">Fizică</option><option value="geografie">Geografie</option></select><button id="refresh" class="primary">↻ Actualizează</button></div></div><div id="content" class="center">Se încarcă elevii...</div></section>
  </main>
</section>
<script>
const SUPABASE_URL='https://vooflhvdoutjplfbnahl.supabase.co';
const SUPABASE_PUBLIC_KEY='sb_publishable_iuJBis3q_83zNlYFER2AXQ_o8gzpDPA';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
const SUBJECTS={romana:{label:'Limba Română',icon:'✒️',primary:'#a83d83',soft:'#da91bf',bg:'#fff4fa'},matematica:{label:'Matematică',icon:'📐',primary:'#17386f',soft:'#5174ad',bg:'#f3f7ff'},biologie:{label:'Biologie',icon:'🧬',primary:'#367b52',soft:'#78af8a',bg:'#f3fbf5'},chimie:{label:'Chimie',icon:'🧪',primary:'#5790a7',soft:'#9cc8d8',bg:'#f3fbfe'},fizica:{label:'Fizică',icon:'⚛️',primary:'#503579',soft:'#8971ad',bg:'#f8f4fd'},geografie:{label:'Geografie',icon:'🌍',primary:'#7a3045',soft:'#d98fa3',bg:'#fff5f7'}};
let staff=null,rows=[];
const $=id=>document.getElementById(id); const esc=v=>{const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML};
function showLogin(msg=''){ $('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginMsg').textContent=msg;$('loginBtn').disabled=false;$('loginBtn').textContent='Intră în cont'; }
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden'); }
async function staffForCurrentUser(){const {data:{user},error}=await sb.auth.getUser();if(error||!user)return null;const r=await sb.from('staff_accounts').select('user_id,display_name,role,subject').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;return r.data||null;}
function theme(){if(staff.role==='admin'){document.body.classList.add('admin');document.documentElement.style.setProperty('--primary','#4f3474');document.documentElement.style.setProperty('--soft','#b48bcc');document.documentElement.style.setProperty('--bg','#faf7fc');$('hello').textContent=`Bună, ${staff.display_name}!`;$('heroText').textContent='Ai acces la toate materiile Formula X.';$('subjectPill').textContent='⚙️ Administrator';return}document.body.classList.remove('admin');const t=SUBJECTS[staff.subject]||SUBJECTS.geografie;document.documentElement.style.setProperty('--primary',t.primary);document.documentElement.style.setProperty('--soft',t.soft);document.documentElement.style.setProperty('--bg',t.bg);$('hello').textContent=`Bună, ${staff.display_name}!`;$('heroText').textContent='Aici găsești elevii înscriși la materia ta.';$('subjectPill').textContent=`${t.icon} ${t.label}`;}
async function openPortal(){try{staff=await staffForCurrentUser();if(!staff){showLogin('Acest cont nu are acces la Portalul Mentorilor.');return false}if(!['mentor','admin'].includes(staff.role)){showLogin('Acces interzis.');return false}showApp();theme();await load();return true}catch(e){console.error(e);showLogin('Nu am putut verifica drepturile contului.');return false}}
async function load(){ $('content').innerHTML='<div class="center">Se încarcă elevii...</div>';let q=sb.from('enrollments').select('id,full_name,email,phone,subject,level,status,created_at').order('created_at',{ascending:false});if(staff.role==='mentor')q=q.eq('subject',staff.subject);const {data,error}=await q;if(error){console.error(error);$('content').innerHTML='<div class="center">⚠️ Nu am putut încărca elevii. Verifică dacă ai rulat SQL-ul pentru Portalul Mentorilor.</div>';return}rows=data||[];render();}
function filtered(){const s=$('search').value.trim().toLowerCase(),st=$('status').value,su=$('subject').value;return rows.filter(r=>{const hay=[r.full_name,r.email,r.phone,r.level].filter(Boolean).join(' ').toLowerCase();if(s&&!hay.includes(s))return false;if(st&&r.status!==st)return false;if(staff.role==='admin'&&su&&r.subject!==su)return false;return true})}
function counts(arr){$('cTotal').textContent=arr.length;$('cNew').textContent=arr.filter(x=>x.status==='nou').length;$('cActive').textContent=arr.filter(x=>x.status==='activ').length;$('cInactive').textContent=arr.filter(x=>x.status==='inactiv').length;}
function badge(s){if(s==='activ')return '<span class="badge b-activ">● Activ</span>';if(s==='inactiv')return '<span class="badge b-inactiv">● Inactiv</span>';return '<span class="badge b-nou">● Nou</span>'}
function date(v){if(!v)return'-';return new Intl.DateTimeFormat('ro-RO',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}
function render(){const arr=filtered();counts(arr);if(!arr.length){$('content').innerHTML='<div class="center">👨‍🎓 Nu există elevi pentru filtrele selectate.</div>';return}let h='<div class="table-wrap"><table><thead><tr><th>Elev</th><th>Telefon</th><th>Materie</th><th>Nivel</th><th>Data înscrierii</th><th>Status</th><th>Modifică</th></tr></thead><tbody>';for(const r of arr){const t=SUBJECTS[r.subject];const subj=t?`${t.icon} ${t.label}`:r.subject;h+=`<tr><td><div class="name">${esc(r.full_name)}</div><div class="email">${esc(r.email)}</div></td><td>${esc(r.phone||'-')}</td><td>${esc(subj)}</td><td>${esc(r.level||'-')}</td><td>${date(r.created_at)}</td><td>${badge(r.status)}</td><td><select class="status-select" data-id="${r.id}"><option value="nou" ${r.status==='nou'?'selected':''}>Nou</option><option value="activ" ${r.status==='activ'?'selected':''}>Activ</option><option value="inactiv" ${r.status==='inactiv'?'selected':''}>Inactiv</option></select></td></tr>`}h+='</tbody></table></div>';$('content').innerHTML=h;document.querySelectorAll('.status-select').forEach(el=>el.addEventListener('change',()=>changeStatus(el.dataset.id,el.value,el)));}
async function changeStatus(id,status,el){el.disabled=true;const {error}=await sb.from('enrollments').update({status}).eq('id',id);if(error){console.error(error);alert('Statusul nu a putut fi modificat.');await load();return}const r=rows.find(x=>x.id===id);if(r)r.status=status;el.disabled=false;render();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='';$('loginBtn').disabled=true;$('loginBtn').textContent='Se verifică...';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){showLogin('Email sau parolă incorectă.');return}const ok=await openPortal();if(!ok){await sb.auth.signOut();showLogin('Acest cont nu are acces la Portalul Mentorilor.')}});
$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();staff=null;rows=[];showLogin()});$('search').addEventListener('input',render);$('status').addEventListener('change',render);$('subject').addEventListener('change',render);$('refresh').addEventListener('click',load);
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)await openPortal();else showLogin()})();
</script>
</body></html>
